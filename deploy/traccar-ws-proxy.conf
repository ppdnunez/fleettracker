# Traccar live-feed websocket proxy — for the HTTPS vhost of the deployed app.
#
# Why this exists: the browser refuses to open a ws:// socket from a page served over https://
# (mixed content), and the Traccar box answers on a bare IP with no certificate, so it cannot
# offer wss:// itself. TLS is therefore terminated here, on the app's own vhost, and the socket
# is tunnelled onward to Traccar over plain ws:// inside the server network.
#
# Install:
#   1. Enable the modules:  a2enmod proxy proxy_http proxy_wstunnel && systemctl reload apache2
#      (XAMPP/Windows: uncomment LoadModule proxy_module, proxy_http_module and
#       proxy_wstunnel_module in httpd.conf.)
#   2. Paste the block below inside <VirtualHost *:443> for the app's domain, replacing the
#      Traccar host with yours.
#   3. In the app's .env:  TRACCAR_WS_URL=/traccar-ws
#      then  php artisan config:clear  (or config:cache) and  npm run build.
#
# The ?token=... query string is forwarded as-is, which is how Traccar authenticates the socket.

ProxyPreserveHost Off

# Apache 2.4.47+ can do this on mod_proxy_http alone:
#   ProxyPass /traccar-ws http://122.201.79.58/api/socket upgrade=websocket
ProxyPass        /traccar-ws  ws://122.201.79.58/api/socket
ProxyPassReverse /traccar-ws  ws://122.201.79.58/api/socket
